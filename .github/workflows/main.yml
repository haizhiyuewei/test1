name: Build Tiny10 x86 简体中文

on:
  workflow_dispatch:

jobs:
  build-tiny10:
    runs-on: windows-latest

    steps:
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 uup-builder
        run: |
          pip install uup-builder

      - name: 构建 Win10 22H2 x86 简体中文 ISO
        run: |
          # 修正：去掉了不被识别的 --arch 参数，将 x86 写进搜索词
          python -m uup_builder build --search "Windows 10 22H2 x86" --lang zh-cn --edition professional --out ./UUPs --concurrency 8 --compress wim

      - name: 注入 VirtIO 驱动
        run: |
          Invoke-WebRequest -Uri "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso" -OutFile "virtio-win.iso"
          $winIso = Get-ChildItem -Path . -Filter "*.iso" | Where-Object { $_.Name -notlike "*virtio*" } | Select-Object -First 1
          if (-not $winIso) { Write-Error "未找到 Windows ISO 文件"; exit 1 }
          
          $winMount = Mount-DiskImage -ImagePath $winIso.FullName -PassThru
          $winDrive = ($winMount | Get-Volume).DriveLetter
          $virtMount = Mount-DiskImage -ImagePath "$((Get-Item 'virtio-win.iso').FullName)" -PassThru
          $virtDrive = ($virtMount | Get-Volume).DriveLetter

          New-Item -ItemType Directory -Path "C:\Tiny10-ISO" -Force | Out-Null
          Copy-Item -Path "${winDrive}:\*" -Destination "C:\Tiny10-ISO" -Recurse -Force

          $wimPath = "C:\Tiny10-ISO\sources\install.wim"
          $mountPath = "C:\Mount"
          New-Item -ItemType Directory -Path $mountPath -Force | Out-Null
          Mount-WindowsImage -ImagePath $wimPath -Index 1 -Path $mountPath

          $driverBase = "${virtDrive}:\"
          $driverPaths = @(
            "${driverBase}\viostor\x86",
            "${driverBase}\vioscsi\x86",
            "${driverBase}\NetKVM\x86",
            "${driverBase}\Balloon\x86"
          )
          foreach ($driverPath in $driverPaths) {
            if (Test-Path $driverPath) {
              Add-WindowsDriver -Path $mountPath -Driver $driverPath -Recurse
            }
          }

          Dismount-WindowsImage -Path $mountPath -Save
          Dismount-DiskImage -ImagePath $virtMount.ImagePath
          Dismount-DiskImage -ImagePath $winMount.ImagePath

      - name: 重新打包 ISO
        run: |
          $oscdimg = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter "oscdimg.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $oscdimg) {
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2289980" -OutFile "adksetup.exe"
            Start-Process -FilePath "adksetup.exe" -ArgumentList "/quiet /features OptionId.DeploymentTools" -Wait
            $oscdimg = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter "oscdimg.exe" -Recurse | Select-Object -First 1
          }
          if (-not $oscdimg) { Write-Error "未找到 oscdimg.exe"; exit 1 }
          
          $etfsboot = "C:\Tiny10-ISO\boot\etfsboot.com"
          $efisys = "C:\Tiny10-ISO\efi\microsoft\boot\efisys.bin"
          & $oscdimg.FullName -m -o -u2 -udfver102 -bootdata:2#p0,e,b"$etfsboot"#pEF,e,b"$efisys" -l"Tiny10_x86" "C:\Tiny10-ISO" "C:\Tiny10_x86.iso"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Tiny10-x86-ISO
          path: C:\Tiny10_x86.iso
          retention-days: 7
